<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super-agent 全景结构图</title>
<link rel="stylesheet" href="../assets/d.css">
<style>
.sc{margin-left:auto;display:flex;gap:10px}
.sc .btn{height:48px;font-size:19px;padding:0 16px}
.colh{position:absolute;top:196px;font-size:15px;font-weight:800;letter-spacing:.1em;color:var(--g2);padding-bottom:8px;border-bottom:3px solid var(--ink)}
.nd{position:absolute;border:3px solid var(--ink);background:var(--paper);padding:0 20px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;z-index:2;transition:background .2s,color .2s,box-shadow .2s,opacity .3s}
.nd .k{font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--g2)}
.nd .t{font-size:26px;font-weight:900;line-height:1.2;margin-top:2px}
.nd .s{font-size:17px;font-weight:600;color:var(--g1);margin-top:4px;line-height:1.35}
.nd.blk{background:var(--ink);color:#fff}.nd.blk .s{color:#c9c6bf}.nd.blk .k{color:#8d8a83}
.nd.hot{border-color:var(--red)}.nd.hot .t{color:var(--red)}
.nd.drop{border-style:dashed;border-color:var(--g2)}.nd.drop .t{color:var(--g1)}
.nd:hover{box-shadow:0 0 0 3px rgba(228,50,27,.35)}
.nd.on{box-shadow:0 0 0 6px var(--red)}
.nd.dim{opacity:.28}
.env i{display:block;font-style:normal;font-size:18px;font-weight:700;border:2px solid var(--g3);padding:6px 10px;margin-top:8px}
svg.fl{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;overflow:visible;pointer-events:none}
.e{fill:none;stroke:var(--ink);stroke-width:3;transition:opacity .3s,stroke-width .3s}
.e.r{stroke:var(--red);stroke-width:5}
.e.d{stroke:var(--g2);stroke-dasharray:8 8;stroke-width:2.5}
.e.g{stroke:var(--g2);stroke-width:2}
.e.dim{opacity:.15}
.e.lit{stroke-width:6}
.lab{font-family:var(--sans);font-size:17px;font-weight:800;fill:var(--g1)}
.lab.r{fill:var(--red)}
.legend{position:absolute;right:96px;top:196px;display:flex;gap:26px;font-size:17px;font-weight:700;color:var(--g1)}
.legend i{display:inline-block;width:30px;vertical-align:middle;margin-right:8px;border-top:3px solid var(--ink)}
.legend i.r{border-top:5px solid var(--red)}.legend i.d{border-top:3px dashed var(--g2)}
#panel{position:absolute;left:96px;right:96px;top:868px;height:130px;border-top:6px solid var(--ink);padding-top:18px;display:grid;grid-template-columns:300px 1fr;gap:24px;z-index:3}
#pt{font-size:28px;font-weight:900;line-height:1.25}
#pb{font-size:22px;font-weight:600;line-height:1.55;color:#2a2926}
</style></head>
<body><div class="stage">
 <div class="rule"></div>
 <div class="dhead">
  <a class="back" data-def="5" href="../index.html#/5"><span>回到第 5 页</span></a>
  <h1>Super-agent 全景</h1>
  <div class="sc"><button class="btn" data-s="0">① 新消息</button><button class="btn" data-s="1">② 后续消息</button><button class="btn" data-s="2">③ 结果回来</button><button class="btn" data-s="3">④ 值守巡检</button></div>
 </div>
 <div class="colh" style="left:96px;width:220px">事件源</div>
 <div class="colh" style="left:400px;width:260px">过滤</div>
 <div class="colh" style="left:760px;width:300px">前台 · 状态</div>
 <div class="colh" style="left:1160px;width:300px">Worker</div>
 <div class="colh" style="left:1560px;width:264px">值守 · 执行环境</div>
 <div class="legend" style="top:826px"><span><i></i>消息流</span><span><i class="r"></i>订阅直送</span><span><i class="d"></i>Watchdog 巡检</span></div>
 <svg class="fl" id="fl" viewBox="0 0 1920 1080"><defs>
  <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L12 6L0 12z" fill="#111"/></marker>
  <marker id="ahr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L12 6L0 12z" fill="#e4321b"/></marker>
  <marker id="ahg" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L12 6L0 12z" fill="#8d8a83"/></marker></defs>
  <g id="edges"></g>
  <text class="lab" x="540" y="400">候选</text><text class="lab" x="540" y="572">不值得</text>
  <text class="lab r" x="400" y="760">已订阅的话题 → 直送</text>
  <circle id="pk" r="11" fill="#e4321b" opacity="0"/>
 </svg>
 <div id="nodes"></div>
 <div id="panel"><div id="pt">怎么看这张图</div><div id="pb">消息从左往右走：先过两道筛子，再由前台派给 Worker；已经有主人的后续消息走红线直送。Watchdog 在主系统之外定时巡检。点节点看说明，点右上角（或按 1–4）看一条消息怎么走。</div></div>
</div>
<script src="../assets/detail.js"></script>
<script>
(()=>{
const N={
 im:{x:96,y:260,w:220,h:96,k:'IM',t:'群聊 · 私聊',b:'私聊和群聊里的每条消息都是一个事件。说完就可以走开，不用守着会话。'},
 gh:{x:96,y:380,w:220,h:96,k:'GitHub',t:'PR · Issue',b:'PR、Issue 和评论都会触发；一个 PR 就是一个话题（Thread）。'},
 mail:{x:96,y:500,w:220,h:96,k:'邮件',t:'邮件链',b:'一串往来算一个话题；回复可以写得完整、结构化。'},
 ci:{x:96,y:620,w:220,h:96,k:'定时 · CI',t:'CI 结果 · 日程',b:'CI 结果、日历提醒和定时消息。注意：CI 成功也不能一律丢，有 Worker 在等就要通知它。'},
 fast:{x:400,y:260,w:260,h:110,k:'第一道 · 代码',t:'规则筛选',s:'来源 · 群 · 白名单',b:'Fast Path：按来源、群、用户或 bot 白名单做确定性准入；每个来源可以设成「只认明确请求 / 算候选 / 忽略」。已经有主人的话题，在这里就走红线直送。'},
 slow:{x:400,y:420,w:260,h:110,k:'第二道 · 模型',t:'值不值得做',s:'策略写在 prompt 里',b:'Slow Path：只有候选事件才交给模型，结合上下文判断值不值得处理。策略用自然语言写，团队随时可以加改。'},
 drop:{x:400,y:600,w:260,h:80,cls:'drop',k:'丢弃',t:'无关消息',b:'闲聊、无关通知在这里停下，不花 token。'},
 you:{x:760,y:222,w:300,h:90,k:'',t:'你',s:'只和前台说话',b:'你只对前台说话。IM 回复每条不超过 100 词，只在需要你行动或结果能用上时开口。'},
 router:{x:760,y:380,w:300,h:150,cls:'blk',k:'常驻 · 通常轻量模型',t:'Router',s:'接话 · 派活 · 汇总给你',b:'全局的顺序点、协调点和记忆。不执行任务、不拆解任务，可以不给 Bash。忙的时候到达的事件攒成一批，下一轮一起处理。'},
 state:{x:760,y:590,w:300,h:100,k:'状态',t:'数据库 · 引用图',s:'ID + 摘要，顺着 ID 找回',b:'工单、话题、会话都有 ID，存在数据库里，不依赖某次会话。前台用 Chain of Recall 顺着 ID 一跳跳找回老任务的上下文。'},
 thread:{x:760,y:740,w:300,h:90,cls:'hot',k:'订阅表',t:'Thread',s:'多对多 · 代码直送',b:'Worker 订阅一个话题后，后续消息由代码直接送达；前台看得到，但不用再判断和转发。几个 Worker 订阅同一话题，就能自己发现冲突。'},
 wA:{x:1160,y:260,w:300,h:110,k:'Worker',t:'任务会话 A',s:'修 PR #42',b:'一个任务一个隔离会话，全套工具，通常用最强的模型。不直接找你，向前台汇报。'},
 wB:{x:1160,y:420,w:300,h:110,k:'Worker',t:'任务会话 B',s:'复现一个 bug',b:'和其它 Worker 并行。耗时工具用 start() 异步跑，结果作为新事件回来，期间照样能接消息。'},
 wC:{x:1160,y:580,w:300,h:110,cls:'hot',k:'Worker · 已订阅',t:'任务会话 C',s:'订阅了一个话题',b:'订阅了话题，后续消息直接送到这里。新消息不属于自己的任务时，可以退订或交还前台。'},
 wd:{x:1560,y:260,w:264,h:130,cls:'hot',k:'独立于主系统',t:'Watchdog',s:'定时醒来巡一圈',b:'由定时消息驱动的独立会话：查 API 报错、状态恢复失败，也让模型判断每个 Worker 有没有实质进展、有没有跑偏。'},
 env:{x:1560,y:460,w:264,h:250,cls:'env',k:'执行环境 · 留在原地',t:'端上 daemon',s:'<i>你的开发机（BYOM）</i><i>云上机器</i><i>按需开的环境</i>',b:'Agent 循环在云上，状态在库里，代码和工具留在原地。端上只装一个无状态的轻量 daemon；机器离线再连上，需要它的活自动接着做。'}
};
const E={
 im:['M316 308 C360 308 360 315 396 315'],gh:['M316 428 C360 428 360 315 396 315'],mail:['M316 548 C360 548 360 315 396 315'],ci:['M316 668 C360 668 360 315 396 315'],
 fs:['M530 370 L530 416'],sd:['M530 530 L530 596','g'],sr:['M660 475 C710 475 710 455 756 455'],
 ft:['M660 330 C730 330 700 785 756 785','r'],tc:['M1060 785 C1110 785 1110 635 1156 635','r'],
 yr:['M910 314 L910 376','',1],rs:['M910 534 L910 586','',1],
 rA:['M1060 430 C1110 430 1110 315 1156 315'],rB:['M1060 465 C1110 465 1110 475 1156 475'],rC:['M1060 500 C1110 500 1110 615 1156 615'],
 Ae:['M1460 340 C1510 340 1510 585 1556 585','g'],Be:['M1460 500 C1510 500 1510 585 1556 585','g'],Ce:['M1460 660 C1510 660 1510 585 1556 585','g'],
 wA:['M1556 300 C1505 300 1505 290 1464 290','d'],wB:['M1556 325 C1500 325 1500 450 1464 450','d'],wC:['M1556 350 C1495 350 1495 605 1464 605','d']
};
const S=[
 {t:'① 新消息',b:'群里有人报了个 bug：先过代码规则，再让模型判断值得做，前台新开一个 Worker 去复现。',p:[['im'],['fs'],['sr'],['rB']],n:['im','fast','slow','router','wB']},
 {t:'② 后续消息',b:'PR #42 下有新评论：代码查到这个话题已经有人在做，直接送给订阅它的 Worker。前台看得到，但不判断、不转发。',p:[['gh'],['ft'],['tc']],n:['gh','fast','thread','wC']},
 {t:'③ 结果回来',b:'Worker 做完，把结论交回前台；前台压成一句话告诉你：「已修复，测试通过，等你确认后合并。」',p:[['rB',1],['yr',1]],n:['wB','router','you']},
 {t:'④ 值守巡检',b:'Watchdog 独立于主系统，定时醒来，看每个 Worker 是在推进，还是在原地打转、跑偏了。',p:[['wA'],['wB'],['wC']],n:['wd','wA','wB','wC']}
];
const NS='http://www.w3.org/2000/svg',G=document.getElementById('edges'),ND=document.getElementById('nodes'),pk=document.getElementById('pk'),pt=document.getElementById('pt'),pb=document.getElementById('pb');
const intro={t:pt.textContent,b:pb.textContent};
for(const id in E){const [d,c,both]=E[id];const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','e '+(c||''));
 const m=c==='r'?'ahr':(c==='g'||c==='d')?'ahg':'ah';p.setAttribute('marker-end',`url(#${m})`);if(both)p.setAttribute('marker-start',`url(#${m})`);G.appendChild(p);E[id].el=p}
for(const id in N){const n=N[id],el=document.createElement('div');el.className='nd '+(n.cls||'');Object.assign(el.style,{left:n.x+'px',top:n.y+'px',width:n.w+'px',height:n.h+'px'});
 el.innerHTML=`${n.k?`<div class="k">${n.k}</div>`:""}<div class="t">${n.t}</div>${n.s?`<div class="s">${n.s}</div>`:''}`;ND.appendChild(el);n.el=el;
 el.onclick=e=>{e.stopPropagation();select(id)}}
let run=0;
function clear(){for(const id in N)N[id].el.classList.remove('on','dim');for(const id in E)E[id].el.classList.remove('dim','lit');pk.setAttribute('opacity',0);document.querySelectorAll('.sc .btn').forEach(b=>b.classList.remove('on'))}
function select(id){run++;const was=N[id].el.classList.contains('on');clear();if(was){pt.textContent=intro.t;pb.textContent=intro.b;return}N[id].el.classList.add('on');pt.textContent=N[id].t;pb.innerHTML=N[id].b}
async function play(i){const my=++run,s=S[i];clear();document.querySelector(`.sc [data-s="${i}"]`).classList.add('on');pt.textContent=s.t;pb.textContent=s.b;
 for(const id in N)if(!s.n.includes(id))N[id].el.classList.add('dim');const used=s.p.map(x=>x[0]);for(const id in E)E[id].el.classList.toggle('dim',!used.includes(id));
 used.forEach(id=>E[id].el.classList.add('lit'));
 if(document.documentElement.classList.contains('shot')){const P=E[used[0]].el.getPointAtLength(E[used[0]].el.getTotalLength()*.6);pk.setAttribute('cx',P.x);pk.setAttribute('cy',P.y);pk.setAttribute('opacity',1);return}
 while(my===run){for(const [id,rev] of s.p){const p=E[id].el,L=p.getTotalLength(),t0=performance.now(),dur=Math.max(450,L*2.2);pk.setAttribute('opacity',1);
  await new Promise(res=>{(function f(t){if(my!==run)return res();const k=Math.min(1,(t-t0)/dur),q=p.getPointAtLength((rev?1-k:k)*L);pk.setAttribute('cx',q.x);pk.setAttribute('cy',q.y);k<1?requestAnimationFrame(f):res()})(t0)});if(my!==run)return}
  pk.setAttribute('opacity',0);await new Promise(r=>setTimeout(r,700))}}
document.querySelectorAll('.sc .btn').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.s;b.classList.contains('on')?(run++,clear(),pt.textContent=intro.t,pb.textContent=intro.b):play(i)});
document.querySelector('.stage').addEventListener('click',()=>{run++;clear();pt.textContent=intro.t;pb.textContent=intro.b});
addEventListener('keydown',e=>{if(/^[1-4]$/.test(e.key))play(+e.key-1)});
if(document.documentElement.classList.contains('shot'))play(1);
})();
</script></body></html>
