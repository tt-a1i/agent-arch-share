<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会话越开越多，会发生什么？</title>
<link rel="stylesheet" href="../assets/d.css">
<style>
.slots{display:flex;gap:12px;margin-top:22px}
.slots i{width:62px;height:62px;border:3px solid var(--ink);transition:background .25s}
.slots i.on{background:var(--red);border-color:var(--red)}
.st3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;margin-top:40px}
.st3 b{display:block;font-size:84px;font-weight:900;letter-spacing:-.04em;line-height:.9}
.st3 span{display:block;font-size:20px;font-weight:800;margin-top:12px}
#state{font-size:56px;font-weight:900;line-height:1;transition:color .3s}
#field{position:absolute;left:680px;top:230px;width:1144px;height:730px}
#rbar{height:64px;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--ink);color:#fff;font-size:24px;font-weight:900;opacity:0;transform:translateY(-8px);transition:all .5s}
#rbar span{font-size:20px;font-weight:600;color:#c9c6bf}
#field.sa #rbar{opacity:1;transform:none}
#ss{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 24px;margin-top:26px}
.s{position:relative;height:86px;border:3px solid var(--ink);padding:12px 16px;background:var(--paper);transition:background .25s,border-color .25s,opacity .4s}
.s b{font-size:20px;font-weight:800;white-space:nowrap}
.s .pb{position:absolute;left:16px;right:16px;bottom:14px;height:8px;background:var(--g4)}
.s .pb i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .5s}
.s .tag{position:absolute;right:10px;top:10px;font-size:15px;font-weight:900;color:var(--red)}
.s.need.watched{border-color:var(--red)}
.s.need.starve{background:repeating-linear-gradient(135deg,#f7d6cf 0 8px,var(--paper) 8px 16px);border-color:var(--red)}
.s.done{opacity:.35}
</style></head>
<body><div class="stage">
 <div class="rule"></div>
 <div class="dhead"><a class="back" data-def="2" href="../index.html#/2"><span>回到第 2 页</span></a><h1>会话越开越多，会发生什么？</h1><span class="tag">示意模拟：参数为假设，只演示机制，不是实测</span></div>
 <div class="abs" style="left:96px;top:230px;width:560px">
  <div style="display:flex;gap:10px"><button class="btn on" id="mA">你直接盯每个会话</button><button class="btn" id="mB">入口替你盯</button></div>
  <div class="lbl" style="margin-top:44px">你的注意力 · 最多同时盯 5 个</div>
  <div class="slots" id="slots"></div>
  <div id="state" style="margin-top:34px">从容</div>
  <div class="st3"><div><b id="sW">0</b><span>正在盯</span></div><div><b id="sQ" class="red">0</b><span>排队等你</span></div><div><b id="sD">0</b><span>已完成</span></div></div>
  <div style="display:flex;gap:10px;margin-top:44px"><button class="btn" id="add">+ 新任务</button><button class="btn" id="add5">+5</button><button class="btn" id="reset">重置</button></div>
  <p class="small" id="explain" style="margin-top:28px;color:var(--ink);font-weight:600"></p>
 </div>
 <div id="field"><div id="rbar">Router：接话 · 分派 · 转达<span>只把需要你拍板的事交给你</span></div><div id="ss"></div></div>
 <div class="rule b"></div>
 <div class="foot"><span class="src">原文：一个人一般只能同时跟进 3–5 个活跃会话。红框 = 正在等你；斜纹 = 等不到你，只能干等</span></div>
</div>
<script src="../assets/detail.js"></script>
<script>
const CAP=5,names=['修 PR','调研 dots','写周报','排查 CI','审 issue','回邮件','改文档','跑评测','看新闻','对账','做 PPT','发版本','复现 bug','整理笔记','回群消息','查依赖'];
let mode='A',sess=[],id=0,done=0;const $=x=>document.getElementById(x),ss=$('ss'),slots=$('slots');
for(let i=0;i<CAP;i++)slots.appendChild(document.createElement('i'));
function add(){if(sess.filter(s=>s.p<100).length>=24)return;const s={id:id++,name:names[id%names.length]+' #'+id,p:0,need:false,el:document.createElement('div')};s.el.className='s';s.el.innerHTML='<b>'+s.name+'</b><span class="tag"></span><div class="pb"><i></i></div>';ss.appendChild(s.el);sess.push(s);
 if(sess.length>24){const d=sess.findIndex(x=>x.p>=100);if(d>=0){sess[d].el.remove();sess.splice(d,1)}}}
function reset(){sess=[];ss.innerHTML='';done=0;id=0;for(let i=0;i<4;i++)add()}
function setMode(m){mode=m;$('mA').classList.toggle('on',m==='A');$('mB').classList.toggle('on',m==='B');$('field').classList.toggle('sa',m==='B');
 $('explain').textContent=m==='A'?'单会话模式：每个会话走几步就停下来等你确认；超过 5 个，多出来的只能干等。':'Super-agent 模式：Worker 自己往下跑，入口消化掉大部分确认，只有少数真正需要你拍板的才上来（示意参数）。'}
function tick(){const act=sess.filter(s=>s.p<100);
 act.forEach(s=>{if(!s.need&&Math.random()<(mode==='A'?0.45:0.06))s.need=true});
 const need=act.filter(s=>s.need),watched=need.slice(0,CAP);
 watched.forEach(s=>{if(Math.random()<0.3)s.need=false});
 act.forEach(s=>{if(!s.need){s.p=Math.min(100,s.p+(mode==='A'?2.5:4)+Math.random()*2);if(s.p>=100)done++}});
 sess.forEach(s=>{s.el.querySelector('.pb i').style.width=s.p+'%';const w=watched.includes(s);s.el.className='s'+(s.p>=100?' done':s.need?(w?' need watched':' need starve'):'');s.el.querySelector('.tag').textContent=s.p>=100?'完成':s.need?(w?'等你':'干等'):''});
 [...slots.children].forEach((x,i)=>x.classList.toggle('on',i<watched.length));
 $('sW').textContent=watched.length;$('sQ').textContent=Math.max(0,need.length-CAP);$('sD').textContent=done;
 const st=$('state');st.textContent=need.length>CAP?'过载':need.length>=3?'吃紧':'从容';st.style.color=need.length>CAP?'var(--red)':'var(--ink)'}
$('add').onclick=add;$('add5').onclick=()=>{for(let i=0;i<5;i++)add()};$('reset').onclick=reset;$('mA').onclick=()=>setMode('A');$('mB').onclick=()=>setMode('B');
reset();setMode('A');
if(document.documentElement.classList.contains('shot')){for(let i=0;i<10;i++)add();for(let t=0;t<14;t++)tick();}
else{setInterval(tick,600);setInterval(add,1500)}
</script></body></html>
