<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>组织状态：数字化 ≠ 机器可理解</title>
<link rel="stylesheet" href="../assets/d.css">
<style>
.stepbar{position:absolute;left:96px;right:96px;top:120px;display:flex;align-items:center;gap:16px}
.ticks{display:flex;gap:8px;margin-left:20px}
.ticks i{width:28px;height:10px;background:var(--g3);cursor:pointer;transition:all .3s}
.ticks i.on{width:56px;background:var(--red)}.ticks i.done{background:var(--ink)}
.board{position:absolute;left:96px;right:96px;top:200px;bottom:200px}
.lane{position:absolute;border:3px solid var(--ink);background:#fff;padding:16px 18px;transition:opacity .45s,transform .45s,border-color .3s}
.lane.dim{opacity:.28}.lane.focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(228,50,27,.12)}
.lane .k{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g2)}
.lane .t{font-size:24px;font-weight:900;margin-top:6px}
.lane .items{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.lane .items span{font-size:16px;font-weight:700;padding:8px 10px;border:2px solid var(--g3);background:var(--paper)}
.lane .items span.miss{border-color:var(--red);border-style:dashed;color:var(--red);background:#fff}
.lane .items span.ok{border-color:var(--ink)}
.lane .items span.priv{background:repeating-linear-gradient(135deg,#f7d6cf 0 6px,#fff 6px 12px);border-color:var(--red)}
.arrow{position:absolute;font-size:42px;font-weight:900;color:var(--red);opacity:0;transition:opacity .4s}
.arrow.show{opacity:1}
.cap{position:absolute;left:96px;right:96px;bottom:36px;border-top:6px solid var(--ink);padding-top:18px;display:grid;grid-template-columns:160px 1fr 260px;gap:20px}
.cap .no{font-size:100px;font-weight:900;line-height:.85;color:var(--red);letter-spacing:-.04em}
.cap h2{font-size:30px;font-weight:900;line-height:1.25}
.cap p{font-size:20px;font-weight:500;line-height:1.5;margin-top:8px;color:#2a2926}
.cap .sr{font-size:17px;font-weight:800;color:var(--red);margin-top:6px}
.warn{position:absolute;left:96px;right:96px;top:520px;border:3px solid var(--red);padding:14px 20px;background:#fff;opacity:0;transform:translateY(8px);transition:all .4s;pointer-events:none;z-index:5;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.warn.show{opacity:1;transform:none}
.warn .k{font-size:14px;font-weight:800;color:var(--red);letter-spacing:.06em}
.warn .t{font-size:22px;font-weight:900;line-height:1.35}
</style></head>
<body><div class="stage">
 <div class="rule"></div>
 <div class="stepbar">
  <a class="back" data-def="21" href="../index.html#/21"><span>回到第 21 页</span></a>
  <h1 style="font-size:28px;font-weight:900">组织状态：数字化 ≠ 机器可理解</h1>
  <div class="ticks" id="ticks"></div>
  <div style="margin-left:auto;display:flex;gap:10px">
   <button class="btn" id="bp">←</button><button class="btn" id="bn">→</button><button class="btn" id="ba">自动</button>
  </div>
 </div>
 <div class="board" id="board"></div>
 <div class="warn" id="warn"></div>
 <div class="cap">
  <div class="no" id="cn">01</div>
  <div id="ctxt"></div>
  <div style="font-size:15px;font-weight:600;color:var(--g2);text-align:right;padding-top:16px">← → · A 自动 · Esc 返回</div>
 </div>
</div>
<script src="../assets/detail.js"></script>
<script>
(()=>{
const SHOT=document.documentElement.classList.contains('shot');
const board=document.getElementById('board'),warn=document.getElementById('warn');
const S=[
 {h:'组织里「有信息」的地方',p:'群聊、会议纪要、文档、Issue——这些是数字化了的片段。',sr:'【原文延伸·讨论】信息存在 ≠ 组织已经理解。',
  lanes:[
   {x:0,y:0,w:380,h:280,k:'公开通道',t:'拿得到的',items:[['ok','飞书群聊'],['ok','会议纪要'],['ok','需求文档'],['ok','GitHub Issue']]},
   {x:420,y:0,w:380,h:280,k:'个人侧',t:'常常缺席',items:[['miss','私聊里的改期'],['miss','未记录的口头决定'],['miss','默会的技术背景']],dim:1},
   {x:840,y:0,w:380,h:280,k:'机器视角',t:'拼不出全貌',items:[['miss','依赖关系模糊'],['miss','风险无人关联'],['miss','谁有权拍板？']],dim:1}
  ],warn:null},
 {h:'数字化 ≠ 机器可理解',p:'传统工具面向人阅读；Agent 要的是可验证、带权限的状态——任务、依赖、证据、决策边界。',sr:'【倾向】先补状态层，再谈中心化组织大脑。',
  lanes:[
   {x:0,y:0,w:520,h:300,k:'对人够用',t:'人类可读的碎片',items:[['ok','纪要：下周必须发'],['ok','Issue：布局有问题'],['ok','群聊：测试还没回归']],focus:1},
   {x:560,y:0,w:660,h:300,k:'对 Agent 不够',t:'缺结构 · 缺关联 · 缺授权',items:[['miss','三条信息无人自动关联'],['miss','发布风险没有「状态对象」'],['miss','Agent 无权替人承诺加班']],focus:1}
  ],
  warn:{k:'【讨论】',t:'真正昂贵的不是发消息，是阅读、理解、关联、决定是否行动。'}},
 {h:'工作现场：可能的新信息通道',p:'macOS 无障碍树优先；不足则截图；输入框与 Agent Session 辅助还原活动。',sr:'【探索】不是已完成的组织产品。',
  lanes:[
   {x:0,y:40,w:280,h:220,k:'01',t:'无障碍树',items:[['ok','前台 App'],['ok','控件树'],['ok','输入框文字']],focus:1},
   {x:320,y:40,w:280,h:220,k:'02',t:'截图兜底',items:[['ok','树读不到时'],['ok','OCR / 视觉']],focus:1},
   {x:640,y:40,w:280,h:220,k:'03',t:'候选事件',items:[['ok','活动摘要'],['ok','待交叉验证']],focus:1},
   {x:960,y:40,w:280,h:220,k:'04',t:'授权共享',items:[['miss','默认不共享'],['ok','用户选择性']],focus:1}
  ],
  warn:{k:'【红线】',t:'个人信息不应默认进组织。采集有隐私与信任成本。'}},
 {h:'活动 ≠ 产出',p:'观察到「忙碌」不等于完成工作，更不等于贡献可结算。必须与 PR/CI/文档交叉核实。',sr:'【未验证】从工作记录推断风险与待办的可靠程度。',
  lanes:[
   {x:0,y:20,w:560,h:280,k:'活动信号',t:'屏幕上发生了什么',items:[['ok','在 IDE 停留 2 小时'],['ok','改了 12 个文件'],['priv','私人聊天窗口也在']],focus:1},
   {x:600,y:20,w:560,h:280,k:'产出证据',t:'可核查的结果',items:[['ok','PR 已开 · CI 绿'],['ok','文档已更新'],['miss','仅活动 → 不能当绩效']],focus:1}
  ],
  warn:{k:'【倾向】',t:'工作记录是信息补充，不是全知视角，更不是监控产品。'}},
 {h:'从观察到参与，还差权限与责任',p:'知道发生了什么 → 判断该做什么 → 有权决定做什么。第三层是治理，不是模型参数。',sr:'【开放】中心化 / 分布式 / 分层混合 —— 用效果与成本验证，不下定论。',
  lanes:[
   {x:0,y:30,w:360,h:240,k:'感知',t:'组织状态可见',items:[['ok','事件'],['ok','任务'],['ok','风险']],focus:1},
   {x:400,y:30,w:360,h:240,k:'判断',t:'提出协调方案',items:[['ok','关联冲突'],['ok','选项+证据']],focus:1},
   {x:800,y:30,w:360,h:240,k:'决定',t:'授权与例外',items:[['miss','必须由人'],['miss','Agent 不能擅自承诺']],focus:1}
  ],
  warn:{k:'【金句】',t:'观察 ≠ 参与。共享状态层，可能比「一个全能组织 Super-agent」更值得探索。'}}
];
function paint(i){
 const s=S[i];board.innerHTML='';
 s.lanes.forEach(L=>{
  const el=document.createElement('div');el.className='lane'+(L.dim?' dim':'')+(L.focus?' focus':'');
  el.style.cssText=`left:${L.x}px;top:${L.y}px;width:${L.w}px;height:${L.h}px`;
  el.innerHTML=`<div class="k">${L.k}</div><div class="t">${L.t}</div><div class="items">${L.items.map(([c,t])=>`<span class="${c}">${t}</span>`).join('')}</div>`;
  board.appendChild(el);
 });
 if(s.warn){warn.className='warn show';if(i===1){warn.style.cssText='left:auto;right:96px;top:240px;width:520px;display:block';warn.innerHTML=`<div class="k">${s.warn.k}</div><div class="t" style="margin-top:8px">${s.warn.t}</div>`}else{warn.style.cssText='';warn.innerHTML=`<div class="k">${s.warn.k}</div><div class="t">${s.warn.t}</div>`}}
 else{warn.className='warn';warn.innerHTML=''}
 document.getElementById('ctxt').innerHTML=`<h2>${s.h}</h2><p>${s.p}</p><div class="sr">${s.sr}</div>`;
 document.getElementById('cn').textContent=String(i+1).padStart(2,'0');
 [...ticks.children].forEach((t,j)=>{t.classList.toggle('on',j===i);t.classList.toggle('done',j<i)});
 history.replaceState(null,'',location.pathname+location.search+'#step='+(i+1));
}
const ticks=document.getElementById('ticks');
S.forEach((_,i)=>{const t=document.createElement('i');t.onclick=()=>go(i);ticks.appendChild(t)});
let cur=-1,auto=null;
function go(i){i=Math.max(0,Math.min(S.length-1,i));cur=i;paint(i)}
function next(){go(cur>=S.length-1&&auto?0:cur+1)}
function toggleAuto(){const b=document.getElementById('ba');if(auto){clearInterval(auto);auto=null;b.classList.remove('on');b.textContent='自动'}else{auto=setInterval(next,5500);b.classList.add('on');b.textContent='暂停'}}
addEventListener('keydown',e=>{const k=e.key;if(['ArrowRight',' ','PageDown','Enter'].includes(k)){e.preventDefault();next()}else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();go(cur-1)}else if(k==='a'||k==='A')toggleAuto()});
document.getElementById('bn').onclick=e=>{e.stopPropagation();next()};document.getElementById('bp').onclick=e=>{e.stopPropagation();go(cur-1)};document.getElementById('ba').onclick=e=>{e.stopPropagation();toggleAuto()};
document.querySelector('.stage').addEventListener('click',e=>{if(e.target.closest('a,button,.ticks'))return;next()});
const m=(location.hash+'').match(/step=(\d+)/);go(m?parseInt(m[1],10)-1:0);
})();
</script></body></html>
