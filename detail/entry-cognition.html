<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>入口管理 ≠ 认知切换</title>
<link rel="stylesheet" href="../assets/d.css">
<style>
.pane{position:absolute;top:210px;bottom:130px;border:3px solid var(--ink);background:#fff;overflow:hidden}
.pane h3{height:56px;display:flex;align-items:center;padding:0 22px;font-size:24px;font-weight:900;border-bottom:3px solid var(--ink);background:var(--paper)}
.pane h3 em{font-style:normal;color:var(--red);margin-left:12px;font-size:18px}
.tabs{display:flex;gap:0;border-bottom:3px solid var(--ink);background:var(--paper)}
.tabs i{flex:1;height:48px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:17px;font-weight:800;border-right:2px solid var(--ink);opacity:.45;transition:all .35s;cursor:default}
.tabs i:last-child{border-right:0}
.tabs i.on{opacity:1;background:var(--ink);color:#fff}
.tabs i.flash{background:var(--red);color:#fff;opacity:1}
.body{padding:28px 24px}
.body .ctx{font-size:34px;font-weight:900;line-height:1.2;min-height:82px}
.body .cost{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.body .cost b{display:block;font-size:48px;font-weight:900;letter-spacing:-.03em;line-height:.9}
.body .cost span{display:block;font-size:16px;font-weight:700;color:var(--g1);margin-top:8px}
.brain{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220px;text-align:center;z-index:5;pointer-events:none}
.brain .orb{width:120px;height:120px;margin:0 auto;border:6px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;background:var(--paper);transition:border-color .4s,background .4s,color .4s}
.brain .orb.hot{border-color:var(--red);background:var(--red);color:#fff}
.brain .lbl{margin-top:14px;font-size:18px;font-weight:800;white-space:nowrap}
.arrow{position:absolute;left:50%;top:42%;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:28px solid var(--red);opacity:0;transition:opacity .3s;transform:translateX(-50%)}
.arrow.show{opacity:1}
.meter{position:absolute;left:96px;right:96px;bottom:34px;height:48px;display:flex;align-items:center;gap:24px}
.meter .bar{flex:1;height:14px;background:var(--g4);position:relative}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .5s}
.cap{position:absolute;left:96px;right:96px;top:120px;display:flex;align-items:center;gap:24px}
.cap .verdict{margin-left:auto;font-size:22px;font-weight:800;max-width:720px;text-align:right;line-height:1.4}
</style></head>
<body><div class="stage">
 <div class="rule"></div>
 <div class="cap">
  <a class="back" data-def="4" href="../index.html#/4"><span>回到第 4 页</span></a>
  <h1 style="font-size:30px;font-weight:900">入口管理 ≠ 认知切换</h1>
  <div style="display:flex;gap:10px;margin-left:24px">
   <button class="btn on" id="mA">五入口 · 自己盯</button>
   <button class="btn" id="mB">一入口 · Router 盯</button>
   <button class="btn" id="play">播放一次切换</button>
  </div>
  <div class="verdict" id="verdict">【讨论】合并入口省的是管理开销；业务上下文仍要你在脑子里切。</div>
 </div>

 <div class="pane" id="left" style="left:96px;width:780px">
  <h3>人看到的界面<em id="uiTag">5 个会话窗口</em></h3>
  <div class="tabs" id="tabs"></div>
  <div class="body">
   <div class="ctx" id="ctx">PR #482 · 布局模块接口变更</div>
   <div class="cost">
    <div><b id="cEntry">5</b><span>入口切换次数（界面）</span></div>
    <div><b id="cCog" class="red">5</b><span>认知重载次数（脑子）</span></div>
   </div>
   <p class="small" style="margin-top:28px;color:var(--ink);font-weight:600;line-height:1.55" id="note">每个窗口各自持有一段业务上下文。切窗口 = 切问题。</p>
  </div>
 </div>

 <div class="brain"><div class="orb" id="orb">你</div><div class="lbl" id="blbl">工作记忆 · 一次一件事</div><div class="arrow" id="arr"></div></div>

 <div class="pane" id="right" style="right:96px;width:780px">
  <h3>系统在做什么<em id="sysTag">分散会话</em></h3>
  <div class="body" style="padding-top:36px">
   <div id="sysRows"></div>
   <p class="small" style="margin-top:32px;border-left:8px solid var(--red);padding-left:18px;color:var(--ink);font-weight:700;line-height:1.55" id="claim">
     【倾向】真正要优化的，不只是「几个聊天窗口」，而是「一次切换要重新装载多少前提」。
   </p>
  </div>
 </div>

 <div class="rule b"></div>
 <div class="meter">
  <span class="src" style="flex:0 0 auto;width:280px">认知负载示意（非实测）</span>
  <div class="bar"><i id="loadBar" style="width:72%"></i></div>
  <span class="src" style="flex:0 0 auto" id="loadTxt">高 · 五任务并行理解</span>
 </div>
</div>
<script src="../assets/detail.js"></script>
<script>
const TASKS=[
 {n:'PR #482',d:'布局模块接口变更 · 要不要合？',sys:'Worker A 等你确认 merge'},
 {n:'邮件链',d:'供应商延期两天 · 影响发版吗？',sys:'邮件 bot 摘要已就绪'},
 {n:'群聊',d:'产品说「下周必须发」',sys:'Thread 已订阅，未仲裁'},
 {n:'CI',d:'核心回归失败 · 修还是缩范围？',sys:'Watchdog 标红卡住'},
 {n:'调研',d:'dots 的 Session 隔离怎么做的？',sys:'研究 bot 写了半份笔记'}
];
const SHOT=document.documentElement.classList.contains('shot');
let mode='A',idx=0,entry=0,cog=0;
const tabs=document.getElementById('tabs'),sys=document.getElementById('sysRows');
TASKS.forEach((t,i)=>{const el=document.createElement('i');el.textContent=t.n;el.onclick=()=>jump(i);tabs.appendChild(el);
 const r=document.createElement('div');r.style.cssText='display:grid;grid-template-columns:140px 1fr;gap:12px;padding:14px 0;border-bottom:2px solid var(--ink);font-size:20px';r.innerHTML='<b style="font-weight:900">'+t.n+'</b><span style="font-weight:600;color:var(--g1)">'+t.sys+'</span>';sys.appendChild(r);t.row=r;t.tab=el});
function paint(){
 [...tabs.children].forEach((t,i)=>t.classList.toggle('on',i===idx));
 document.getElementById('ctx').textContent=TASKS[idx].d;
 document.getElementById('cEntry').textContent=entry;
 document.getElementById('cCog').textContent=cog;
 const load=Math.min(100,40+cog*12+(mode==='A'?20:8));
 document.getElementById('loadBar').style.width=load+'%';
 document.getElementById('loadTxt').textContent=load>75?'高 · 多任务并行理解':load>50?'中 · 仍在切上下文':'低 · 但仍非零';
 document.getElementById('uiTag').textContent=mode==='A'?'5 个会话窗口':'1 个统一入口';
 document.getElementById('sysTag').textContent=mode==='A'?'分散会话，各自等你':'Router 汇总，仍要你拍板';
 document.getElementById('note').textContent=mode==='A'
  ?'每个窗口各自持有一段业务上下文。切窗口 = 切问题。'
  :'界面只剩一个入口；但每条摘要背后仍是不同项目、不同前提、不同决策。';
 document.getElementById('verdict').innerHTML=mode==='A'
  ?'【原文】3–5 会话是人的跟进上限。【质疑】那把五个合成一个，脑子就不乱了吗？'
  :'【讨论】入口成本↓；认知成本与决策成本未必↓。隐藏 Session ≠ 减轻业务理解。';
 document.getElementById('claim').innerHTML=mode==='A'
  ?'【倾向】真正要优化的，不只是「几个聊天窗口」，而是「一次切换要重新装载多少前提」。'
  :'【未验证】统一入口在真实多项目负载下，是否降低有效认知切换成本——需要对照实验，不是口号。';
}
function jump(i){if(i===idx)return;const orb=document.getElementById('orb'),arr=document.getElementById('arr');
 orb.classList.add('hot');arr.classList.add('show');TASKS[i].tab.classList.add('flash');
 setTimeout(()=>{idx=i;entry++;cog++;orb.classList.remove('hot');arr.classList.remove('show');TASKS[i].tab.classList.remove('flash');paint()},mode==='B'?520:380)}
function setMode(m){mode=m;document.getElementById('mA').classList.toggle('on',m==='A');document.getElementById('mB').classList.toggle('on',m==='B');
 // In B mode, tabs collapse visually to one "统一入口" strip but cognition still switches
 if(m==='B'){tabs.style.display='flex';[...tabs.children].forEach((t,i)=>{t.textContent=i===0?'统一入口 · 摘要流':TASKS[i].n;t.style.flex=i===0?'2':'1';t.style.fontSize=i===0?'18px':'14px';t.style.opacity=i===0?'1':'.35'})}
 else{tabs.style.display='flex';[...tabs.children].forEach((t,i)=>{t.textContent=TASKS[i].n;t.style.flex='1';t.style.fontSize='17px';t.style.opacity=''})}
 paint()}
let playing=false;
async function play(){if(playing)return;playing=true;entry=0;cog=0;idx=0;paint();
 const order=mode==='A'?[1,3,0,4,2]:[1,3,0,4,2];
 for(const i of order){await new Promise(r=>setTimeout(r,mode==='B'?700:550));jump(i);await new Promise(r=>setTimeout(r,450))}
 playing=false}
document.getElementById('mA').onclick=()=>setMode('A');
document.getElementById('mB').onclick=()=>setMode('B');
document.getElementById('play').onclick=play;
setMode('A');
if(SHOT){mode='B';setMode('B');entry=5;cog=5;idx=2;paint()}
else setTimeout(play,800);
</script></body></html>
