 routes.forEach(r=>{if(now<r.start)return;r.acc+=dt*1000;if(r.acc>=r.every){r.acc=0;const sg=segs(r);pks.push({r,sg,tot:sg.reduce((a,s)=>a+s.e.L,0),d:0,el:mk(r)})}});
 pks=pks.filter(p=>{if(!p.r)return true;p.d+=dt*(p.r.speed||460);if(p.d>p.tot+120){p.el.remove();return false}
  const P=ptAt(p.sg,Math.min(p.d,p.tot));p.el.setAttribute('x',P.x-8);p.el.setAttribute('y',P.y-8);
  const f=p.d>p.tot?1-(p.d-p.tot)/120:Math.min(1,p.d/40);p.el.setAttribute('opacity',(p.r.ghost?.3:1)*f);return true});
 requestAnimationFrame(frame)}
function next(){go(cur>=S.length-1&&auto?0:cur+1)}
function toggleAuto(){const b=document.getElementById('ba');if(auto){clearInterval(auto);auto=null;b.classList.remove('on');b.textContent='自动'}else{auto=setInterval(next,6500);b.classList.add('on');b.textContent='暂停'}}
addEventListener('keydown',e=>{const k=e.key;if(['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(k)){e.preventDefault();next()}else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(k)){e.preventDefault();go(cur-1)}else if(k==='a'||k==='A')toggleAuto();else if(k==='Home')go(0);else if(k==='End')go(S.length-1)});
document.getElementById('bn').onclick=e=>{e.stopPropagation();next()};document.getElementById('bp').onclick=e=>{e.stopPropagation();go(cur-1)};document.getElementById('ba').onclick=e=>{e.stopPropagation();toggleAuto()};
document.querySelector('.stage').addEventListener('click',e=>{if(e.target.closest('a,button,.ticks'))return;next()});
paint('ds');place('ds');
const m=(location.hash+location.search).match(/step=(\d+)/);go(m?parseInt(m[1],10)-1:0);
if(/[?&]auto/.test(location.search))toggleAuto();
if(!SHOT)requestAnimationFrame(frame);
addEventListener('hashchange',()=>{const m=location.hash.match(/step=(\d+)/);if(m)go(parseInt(m[1],10)-1)});
})();
</script></body></html>
