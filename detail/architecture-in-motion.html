<style>
html,body{height:100%;overflow:hidden;background:#060a17}
#vp{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(1100px 700px at 50% 45%,#121a3d 0,#070b19 60%,#04060f 100%)}
#st{width:1600px;height:900px;position:relative;flex:none;transform-origin:center;overflow:hidden}
#st:before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(120,140,220,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,220,.06) 1px,transparent 1px);
  background-size:40px 40px;mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 75%)}
/* header */
.hd{position:absolute;left:0;right:0;top:0;height:72px;display:flex;align-items:center;gap:22px;padding:0 36px;z-index:20}
.back{display:inline-flex;align-items:center;padding:9px 18px;border-radius:999px;background:var(--cyan);color:#06202a;font-weight:800;text-decoration:none;font-size:16px}
.hd h1{font-size:23px;font-weight:800;letter-spacing:.01em}
.hd .mode{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--dim)}
.hd .mode b{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);transition:all .6s}
.hd .mode b.team{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.12);color:#bbf7d0}
/* edges */
svg#ed{position:absolute;inset:0;z-index:1;overflow:visible}
.edge{fill:none;stroke:rgba(150,165,220,.22);stroke-width:2.2;transition:opacity .6s,stroke .6s}
.edge.dash{stroke-dasharray:7 7}
.edge.on{stroke:var(--ec,#22d3ee);stroke-width:3;stroke-dasharray:10 9;animation:flow 1s linear infinite;filter:drop-shadow(0 0 4px var(--ec,#22d3ee))}
@keyframes flow{to{stroke-dashoffset:-19}}
.ptag{font-size:14px;font-weight:800;fill:#bbf7d0;paint-order:stroke;stroke:#062016;stroke-width:5px;text-anchor:middle}
.elab{font-size:15px;font-weight:700;fill:#cbd5f5;paint-order:stroke;stroke:#070b19;stroke-width:6px;transition:opacity .5s;text-anchor:middle}
/* nodes */
.node{position:absolute;z-index:3;border-radius:20px;padding:14px 16px 12px 16px;display:flex;gap:12px;align-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 60%),#0e1430;
  border:1.5px solid var(--c);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
  transition:opacity .6s,filter .6s,box-shadow .6s,transform .6s,border-color .9s}
.node .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff 0%),color-mix(in srgb,var(--c) 25%,#0b1030));transition:background .9s}
.node .tx{min-width:0;transition:opacity .35s}
.node .tt{font-size:20px;font-weight:800;line-height:1.25;white-space:nowrap}
.node .sb{font-size:14px;color:var(--dim);margin-top:3px;white-space:nowrap}
.node .tg{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:999px;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.node.dim{opacity:.22;filter:saturate(.3)}
.node.half{opacity:.6 !important;filter:saturate(.7) !important}
.node.act{box-shadow:0 0 0 1px var(--c),0 0 34px color-mix(in srgb,var(--c) 55%,transparent),0 14px 40px rgba(0,0,0,.5);transform:scale(1.045)}
.node.gone{opacity:0 !important;transform:scale(.6);pointer-events:none}
.node.router .tt{font-size:24px}
.node .bar{position:absolute;left:16px;right:16px;bottom:8px;height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;opacity:0;transition:opacity .4s}
.node .bar i{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--c),transparent);animation:sh 1.3s linear infinite}
@keyframes sh{from{left:-40%}to{left:100%}}
.node.work .bar{opacity:1}
.node .badge{position:absolute;top:-13px;right:12px;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--c);color:#081022;opacity:0;transform:translateY(6px);transition:all .4s}
.node.badged .badge{opacity:1;transform:none}
.ring{position:absolute;inset:-10px;border-radius:26px;border:2px solid var(--c);opacity:0;pointer-events:none}
.node.ping .ring{animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{opacity:.8;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
/* bubbles */
.bub{position:absolute;z-index:6;max-width:330px;padding:12px 16px;border-radius:16px;font-size:17px;line-height:1.5;
  background:#f8fafc;color:#0b1022;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(10px) scale(.96);transition:all .45s}
.bub.show{opacity:1;transform:none}
.bub:after{content:"";position:absolute;bottom:-9px;left:34px;border:10px solid transparent;border-bottom:0;border-top-color:#f8fafc}
.bub.dark{background:#1a2246;color:#e2e8ff;border:1px solid rgba(255,255,255,.15)}
.bub.dark:after{border-top-color:#1a2246}
.bub small{display:block;font-size:13px;font-weight:500;opacity:.65;margin-top:2px}
/* caption */
.cap{position:absolute;left:36px;right:36px;bottom:24px;height:156px;z-index:10;display:flex;gap:28px;align-items:stretch;
  background:linear-gradient(180deg,rgba(18,24,54,.88),rgba(10,14,34,.92));border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:18px 24px;backdrop-filter:blur(10px)}
.cap .num{flex:none;width:118px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line)}
.cap .num b{font-size:54px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.cap .num span{font:600 15px var(--mono);color:var(--mute);margin-top:4px}
.cap .txt{flex:1;min-width:0;transition:opacity .3s}
.cap h2{font-size:27px;font-weight:800;margin-bottom:6px}
.cap p{font-size:17px;line-height:1.55;color:#c3cbe6}
.cap .src{display:inline-block;margin-top:6px;font-size:14px;font-weight:700;color:var(--amber);border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.1);padding:2px 10px;border-radius:7px}
.map{display:flex;flex-wrap:wrap;gap:7px 9px;margin-top:4px}
.map span{font-size:15px;padding:4px 11px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#dbe2ff;white-space:nowrap}
.map span em{font-style:normal;color:var(--mute);margin:0 5px}
.map span.an{border-color:rgba(251,113,133,.6);color:#fecdd3}
.ctl{flex:none;width:236px;display:flex;flex-direction:column;justify-content:center;gap:12px;align-items:flex-end}
.ctl .btns{display:flex;gap:8px}
.ctl button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);height:40px;min-width:44px;padding:0 14px;border-radius:11px;font:700 16px var(--font);cursor:pointer}
.ctl button:hover{background:rgba(34,211,238,.2);border-color:var(--cyan)}
.ctl button.on{background:var(--cyan);color:#06202a;border-color:var(--cyan)}
.dots{display:flex;gap:7px}
.dots i{width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.14);transition:all .3s;cursor:pointer}
.dots i.on{width:34px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.hint{font-size:12.5px;color:var(--mute)}
</style>

<script>
(function(){
const st=document.getElementById('st');
function fit(){st.style.transform='scale('+Math.min(innerWidth/1600,innerHeight/900)+')';}addEventListener('resize',fit);fit();

/* ---------- nodes: two states (ds = DeepSeek, team = our bot team) ---------- */
const C={cyan:'#22d3ee',violet:'#a78bfa',indigo:'#818cf8',coral:'#fb7185',amber:'#fbbf24',mint:'#34d399',slate:'#94a3b8',gray:'#64748b'};
const NODES={
 im:{w:224,h:96,ds:{x:150,y:430,ic:'💬',t:'你 · IM',s:'私聊 / 群聊 / 话题',c:C.slate},team:{x:150,y:430,ic:'🙋',t:'你',s:'和大内总管聊天',c:C.slate}},
 drop:{w:262,h:84,ds:{x:450,y:225,ic:'🗑️',t:'丢弃',s:'无关消息不进模型',c:C.gray},team:{x:450,y:225,ic:'🛑',t:'审批关卡',s:'对外动作停下等你点头',c:C.coral}},

 thread:{w:236,h:96,ds:{x:450,y:648,ic:'🧵',t:'Thread 订阅表',s:'同一 PR / 话题 / 邮件链',c:C.mint},team:{x:450,y:648,ic:'🧵',t:'Thread 订阅表',s:'',c:C.mint,gone:true}},
 router:{w:276,h:128,cls:'router',ds:{x:770,y:430,ic:'🧭',t:'常驻路由',s:'通常轻量模型 · 只派发',tg:'不持有 Bash',c:C.cyan},team:{x:770,y:430,ic:'🧭',t:'大内总管',s:'唯一入口 · 只路由',tg:'不研究 · 不写代码',c:C.cyan}},
 state:{w:276,h:92,ds:{x:770,y:220,ic:'🗂️',t:'ID + 摘要',s:'会话状态 · 引用图',c:C.violet},team:{x:770,y:220,ic:'📁',t:'共享目录 team',s:'共享文件夹 · 交接写文件',c:C.violet}},
 wA:{w:290,h:96,ds:{x:1125,y:220,ic:'🛠️',t:'任务会话 A',s:'通常最强模型 · 全套工具',c:C.indigo},team:{x:1125,y:220,ic:'🛠️',t:'仓库维护 bot',s:'Archify · OpenPi · Hive',c:C.indigo}},
 wB:{w:290,h:96,ds:{x:1125,y:430,ic:'🛠️',t:'任务会话 B',s:'通常最强模型 · 全套工具',c:C.indigo},team:{x:1125,y:430,ic:'✉️',t:'邮件管家',s:'QQ 邮箱',c:C.indigo}},
 wC:{w:290,h:96,ds:{x:1125,y:640,ic:'🛠️',t:'任务会话 C',s:'通常最强模型 · 全套工具',c:C.indigo},team:{x:1125,y:640,ic:'🔭',t:'研究类 bot',s:'学习研究官等 5 个 bot',c:C.indigo}},
 wd:{w:244,h:118,ds:{x:1440,y:430,ic:'🐕',t:'Watchdog',s:'定时消息驱动',tg:'独立于主系统',c:C.coral},team:{x:1440,y:430,ic:'🔍',t:'架构观察员',s:'每天审查 · 只提建议',tg:'≈ Watchdog（类比）',c:C.coral}}
};
const nodesEl=document.getElementById('nodes');const pos={};
for(const id in NODES){const n=NODES[id];const el=document.createElement('div');el.className='node '+(n.cls||'');el.id='n-'+id;
  el.style.width=n.w+'px';el.style.height=n.h+'px';
  el.innerHTML='<div class="ring"></div><div class="ic"></div><div class="tx"><div class="tt"></div><div class="sb"></div><div class="tg"></div></div><div class="bar"><i></i></div><div class="badge"></div>';
  nodesEl.appendChild(el);n.el=el;pos[id]={x:n.ds.x,y:n.ds.y};}
function paintLabels(mode){for(const id in NODES){const n=NODES[id],s=n[mode],el=n.el;
  el.querySelector('.ic').textContent=s.ic;el.querySelector('.tt').textContent=s.t;el.querySelector('.sb').textContent=s.s||'';
  const tg=el.querySelector('.tg');tg.textContent=s.tg||'';tg.style.display=s.tg?'inline-block':'none';el.style.setProperty('--c',s.c);}}
function place(){for(const id in NODES){const n=NODES[id],p=pos[id];n.el.style.left=(p.x-n.w/2)+'px';n.el.style.top=(p.y-n.h/2)+'px';}}

/* ---------- edges ---------- */
const E=[
 ['im-filter','im','filter','ds',{}],
 ['filter-drop','filter','drop','ds',{lab:'忽略'}],
 ['filter-router','filter','router','ds',{}],
 ['filter-thread','filter','thread','ds',{}],
 ['thread-wC','thread','wC','ds',{lab:'按 Thread 直送',col:C.mint}],
 ['router-state','router','state','both',{dash:1}],
 ['router-wA','router','wA','both',{}],
 ['router-wB','router','wB','both',{}],
 ['router-wC','router','wC','both',{lab:'派发'}],
 ['wd-wA','wd','wA','both',{dash:1,col:C.coral}],
 ['wd-wB','wd','wB','both',{dash:1,col:C.coral}],
 ['wd-wC','wd','wC','both',{dash:1,col:C.coral}],
 ['reply','router','im','ds',{special:'reply',lab:'≤100 词',col:C.amber}],
 ['you-router','im','router','team',{lab:'聊天'}],
 ['router-gate','router','drop','team',{fs:'top',ts:'right',col:C.coral}],
 ['gate-you','drop','im','team',{fs:'left',ts:'top',lab:'请你点头',col:C.coral}],
 ['routine-wC','filter','wC','team',{lab:'定时唤醒',col:C.amber}],
 ['wA-state','wA','state','team',{lab:'交接写文件',col:C.violet,fs:'top',ts:'top',d:70}]
];
const EG=document.getElementById('edges'),LG=document.getElementById('labels'),NS='http://www.w3.org/2000/svg';const ED={};
E.forEach(([id,a,b,m,o])=>{const p=document.createElementNS(NS,'path');p.setAttribute('class','edge'+(o.dash?' dash':''));p.style.setProperty('--ec',o.col||C.cyan);EG.appendChild(p);
  let t=null;if(o.lab){t=document.createElementNS(NS,'text');t.setAttribute('class','elab');t.textContent=o.lab;LG.appendChild(t);}
  ED[id]={id,a,b,m,o,p,t};});
function anchor(id,side){const n=NODES[id],p=pos[id];return side==='right'?[p.x+n.w/2,p.y]:side==='left'?[p.x-n.w/2,p.y]:side==='top'?[p.x,p.y-n.h/2]:[p.x,p.y+n.h/2];}
function geom(e){
  if(e.o.special==='reply'){const s=anchor('router','bottom'),t=anchor('im','bottom');return `M${s[0]},${s[1]} C${s[0]},${s[1]+150} ${t[0]},${t[1]+150} ${t[0]},${t[1]}`;}
  const A=pos[e.a],B=pos[e.b];const dx=B.x-A.x,dy=B.y-A.y;let fs=e.o.fs,ts=e.o.ts;
  if(!fs){if(Math.abs(dx)>Math.abs(dy)*0.8){fs=dx>0?'right':'left';ts=dx>0?'left':'right';}else{fs=dy>0?'bottom':'top';ts=dy>0?'top':'bottom';}}
  const s=anchor(e.a,fs),t=anchor(e.b,ts);const k=(sd,pt,d)=>sd==='right'?[pt[0]+d,pt[1]]:sd==='left'?[pt[0]-d,pt[1]]:sd==='top'?[pt[0],pt[1]-d]:[pt[0],pt[1]+d];
  const d=e.o.d||Math.max(40,Math.hypot(t[0]-s[0],t[1]-s[1])*.42);const c1=k(fs,s,d),c2=k(ts,t,d);
  return `M${s[0]},${s[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${t[0]},${t[1]}`;}
function drawEdges(){for(const id in ED){const e=ED[id];e.p.setAttribute('d',geom(e));if(e.t){const L=e.p.getTotalLength(),pt=e.p.getPointAtLength(L/2);e.t.setAttribute('x',pt.x);e.t.setAttribute('y',pt.y-10);}}}

/* ---------- packets ---------- */
const PK=document.getElementById('pk');let routes=[],packets=[];
function addPacket(r){const g=document.createElementNS(NS,'g');const halo=document.createElementNS(NS,'circle');halo.setAttribute('r',15);halo.setAttribute('fill',r.col);halo.setAttribute('filter','url(#glow)');halo.setAttribute('opacity',.85);
  const trail=[];for(let i=0;i<7;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('r',6-i*.7);c.setAttribute('fill',r.col);c.setAttribute('opacity',.55-i*.07);g.appendChild(c);trail.push(c);}
  const core=document.createElementNS(NS,'circle');core.setAttribute('r',7);core.setAttribute('fill','#fff');
  g.prepend(halo);g.appendChild(core);let tag=null;
  if(r.faint){halo.setAttribute('opacity',.3);core.setAttribute('r',4);core.setAttribute('opacity',.55);trail.forEach(c=>c.setAttribute('opacity',.18));}
  if(r.tag){tag=document.createElementNS(NS,'text');tag.setAttribute('class','ptag');tag.textContent=r.tag;g.appendChild(tag);}
  PK.appendChild(g);packets.push({r,g,halo,core,trail,tag,d:0});}
function segs(r){return r.path.map(x=>{const rev=x[0]==='-';const e=ED[rev?x.slice(1):x];return {e,rev,L:e.p.getTotalLength()};});}
function ptAt(sg,d){for(const s of sg){if(d<=s.L){return s.e.p.getPointAtLength(s.rev?s.L-d:d);}d-=s.L;}const s=sg[sg.length-1];return s.e.p.getPointAtLength(s.rev?0:s.L);}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(tween){const k=Math.min(1,(now-tween.t0)/tween.ms);const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    for(const id in pos){pos[id].x=tween.from[id].x+(tween.to[id].x-tween.from[id].x)*e;pos[id].y=tween.from[id].y+(tween.to[id].y-tween.from[id].y)*e;}
    place();drawEdges();if(k>=1)tween=null;}
  routes.forEach(r=>{if(now<r.start)return;r.acc+=dt*1000;if(r.acc>=r.every){r.acc=0;addPacket(r);}});
  packets=packets.filter(p=>{const sg=segs(p.r),tot=sg.reduce((a,s)=>a+s.L,0);p.d+=dt*(p.r.speed||430);
    if(p.d>tot+20){p.g.remove();return false;}
    const P=ptAt(sg,Math.min(p.d,tot));p.halo.setAttribute('cx',P.x);p.halo.setAttribute('cy',P.y);p.core.setAttribute('cx',P.x);p.core.setAttribute('cy',P.y);if(p.tag){p.tag.setAttribute('x',P.x);p.tag.setAttribute('y',P.y-20);}
    p.trail.forEach((c,i)=>{const q=ptAt(sg,Math.max(0,Math.min(p.d,tot)-(i+1)*11));c.setAttribute('cx',q.x);c.setAttribute('cy',q.y);});
    const fade=p.d>tot?1-(p.d-tot)/20:1;p.g.setAttribute('opacity',fade);return true;});
  requestAnimationFrame(frame);}

/* ---------- steps ---------- */
const S=[
 {mode:'ds',act:['im','filter'],edges:['im-filter'],
  pk:[{path:['im-filter'],col:C.cyan,every:1700}],
  bub:[[60,300,'“帮我看看 PR 里那个 bug”','light']],
  h:'用户在 IM 发出一条消息',p:'消息不是直接塞给一个聊天窗口，而是作为一个<b>事件</b>进入系统。agent 是常驻的：你不用开会话、盯会话，说完就可以去忙别的。'},
 {mode:'ds',act:['filter','drop'],edges:['im-filter','filter-drop','filter-router'],
  pk:[{path:['im-filter','filter-drop'],col:'#94a3b8',every:1300},{path:['im-filter','filter-router'],col:C.cyan,every:2600,delay:650}],
  bub:[[40,150,'群聊闲聊、无关通知 → 忽略<small>不进模型，不花 token</small>','dark']],
  h:'代码规则先过滤：无关消息不进模型',p:'Fast Path 按来源、群、用户、bot 设白名单，每个来源可设“只响应显式请求 / 作为候选 / 忽略”。挡掉的不进模型；要语义判断的才交给 LLM 慢速路径。',src:'能用代码判断的，不交给模型'},
 {mode:'ds',act:['router','state','wC'],edges:['filter-router','router-state','router-wC'],spawn:'wC',
  pk:[{path:['filter-router','router-wC'],col:C.cyan,every:2400},{path:['router-state'],col:C.violet,every:1600,speed:260},{path:['-router-state'],col:C.violet,every:1600,delay:800,speed:260}],
  bub:[[640,525,'新任务 → 开一个新的任务会话','dark']],badge:{wC:'新会话'},
  h:'常驻路由：看 ID + 摘要，决定开新会话',p:'路由通常用轻量模型，不持有 Bash，<b>只派发、不拆解</b>。上下文里先只放对象 ID 和摘要，按需内联，需要时顺着引用逐跳召回（Chain of Recall）。判断这是新任务，就开一个新的任务会话。'},

 {mode:'ds',act:['im','filter','thread','wC'],edges:['im-filter','filter-thread','thread-wC'],dimNode:['router'],work:['wC'],
  half:['router'],
  pk:[{path:['im-filter','filter-thread','thread-wC'],col:C.mint,every:2600,tag:'Thread：PR 话题'},{path:['im-filter','filter-router'],col:'#7ee7f7',every:2600,faint:1}],
  bub:[[40,292,'↩ 原话题里回复：“顺便补上测试”','light'],[640,525,'路由：看得到这条，但不用判断和转发','dark']],
  h:'在原话题里追问：代码直接送到归属会话',p:'同一个 IM 话题 / 回复串、PR 或邮件链 = 一个 Thread。任务会话在第一条事件时订阅它，之后这个 Thread 的消息由代码直送；路由<b>看得到，但不用判断和转发</b>。不带话题 / 回复直接发的新消息自成新 Thread，仍交给路由判断。',src:'原文消融：去掉直送，cache-read token 多约 37%（23.2M→31.8M），路由决策多约 30%；任务不更快也不更好（合成负载，仅供参考）'},

const TOTAL=S.length;let cur=-1,mode='ds',tween=null,auto=null;
document.getElementById('ct').textContent='/ '+String(TOTAL).padStart(2,'0');
const dots=document.getElementById('dots');S.forEach((_,i)=>{const d=document.createElement('i');d.onclick=e=>{e.stopPropagation();go(i);};dots.appendChild(d);});
const bubs=document.getElementById('bubs');
function setMode(m,animate){if(m===mode)return;mode=m;
  const from={},to={};for(const id in pos){from[id]={...pos[id]};to[id]={x:NODES[id][m].x,y:NODES[id][m].y};}
  // label crossfade
  document.querySelectorAll('.node .tx,.node .ic').forEach(x=>x.style.opacity=0);
  setTimeout(()=>{paintLabels(m);document.querySelectorAll('.node .tx,.node .ic').forEach(x=>x.style.opacity=1);},animate?520:0);
  if(animate)tween={from,to,t0:performance.now(),ms:1500};else{for(const id in pos)pos[id]=to[id];place();drawEdges();}
  const mb=document.getElementById('modeB');mb.textContent=m==='team'?'我们的 bot 团队（Grok Bot 上）':'DeepSeek Super-agent（研究原型）';mb.classList.toggle('team',m==='team');}
function go(i){i=Math.max(0,Math.min(TOTAL-1,i));if(i===cur)return;const prev=cur;cur=i;const s=S[i];
  const morph=s.mode!==mode;setMode(s.mode,prev>=0&&morph);
  for(const id in NODES){const n=NODES[id],el=n.el,gone=n[s.mode].gone||(s.mode==='ds'&&id==='wC'&&i<2);
    el.classList.toggle('gone',!!gone);el.classList.toggle('act',s.act.includes(id));el.classList.toggle('dim',!s.act.includes(id));
    el.classList.toggle('half',!!(s.half&&s.half.includes(id)));el.classList.toggle('work',!!(s.work&&s.work.includes(id)));el.classList.toggle('ping',!!(s.ping&&s.ping.includes(id)));
    const b=s.badge&&s.badge[id];el.classList.toggle('badged',!!b);if(b)el.querySelector('.badge').textContent=b;}
  for(const id in ED){const e=ED[id],vis=e.m==='both'||e.m===s.mode,on=s.edges.includes(id);
    e.p.style.opacity=vis?(on?1:.5):0;e.p.classList.toggle('on',on);if(e.t)e.t.style.opacity=vis&&on?1:0;}
  packets.forEach(p=>p.g.remove());packets=[];const now=performance.now(),base=morph&&prev>=0?1500:250;
  routes=s.pk.map(r=>({...r,start:now+base+(r.delay||0),acc:r.every}));
  bubs.innerHTML='';const bdelay=morph&&prev>=0?1600:350;
  s.bub.forEach(([bx,by,html,kind])=>{const b=document.createElement('div');b.className='bub '+(kind==='dark'?'dark':'');b.innerHTML=html;
    b.style.left=bx+'px';b.style.top=by+'px';bubs.appendChild(b);setTimeout(()=>b.classList.add('show'),bdelay);});
  const tx=document.getElementById('ctxt');tx.style.opacity=0;
  setTimeout(()=>{let h='<h2>'+s.h+'</h2>';
    if(s.map){h+='<div class="map"><span>常驻路由<em>→</em>大内总管</span><span>任务会话<em>→</em>各专职 bot</span><span>状态 / 交接<em>→</em>共享目录 team</span><span>事件触发<em>→</em>routine</span><span>权限关卡<em>→</em>审批：停下等你点头</span><span class="an">Watchdog<em>≈</em>架构观察员（我们的类比：每天一次、只提建议，不是持续看门狗）</span></div>';}
    else h+='<p>'+s.p+'</p>'+(s.src?'<span class="src">'+s.src+'</span>':'');
    tx.innerHTML=h;tx.style.opacity=1;},180);
  document.getElementById('cn').textContent=String(i+1).padStart(2,'0');[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
  history.replaceState(null,'',location.pathname+location.search+'#step='+(i+1));}
function next(){go(cur>=TOTAL-1&&auto?0:cur+1);}function prevS(){go(cur-1);}
function toggleAuto(){const b=document.getElementById('ba');if(auto){clearInterval(auto);auto=null;b.classList.remove('on');b.textContent='▶ 自动';}else{auto=setInterval(next,6500);b.classList.add('on');b.textContent='❚❚ 暂停';}}
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next();}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prevS();}else if(e.key==='a'||e.key==='A')toggleAuto();else if(e.key==='Home')go(0);else if(e.key==='End')go(TOTAL-1);});
document.getElementById('bn').onclick=e=>{e.stopPropagation();next();};document.getElementById('bp').onclick=e=>{e.stopPropagation();prevS();};document.getElementById('ba').onclick=e=>{e.stopPropagation();toggleAuto();};
st.addEventListener('click',e=>{if(e.target.closest('a,button,.dots'))return;next();});
paintLabels('ds');place();drawEdges();
const m=(location.hash+location.search).match(/step=(\d+)/);go(m?parseInt(m[1],10)-1:0);
requestAnimationFrame(frame);
window.__go=go;addEventListener('hashchange',()=>{const m=location.hash.match(/step=(\d+)/);if(m)go(parseInt(m[1],10)-1);});
})();
