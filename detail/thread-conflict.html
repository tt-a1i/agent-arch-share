<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thread 广播：信息可见 ≠ 状态一致 ≠ 行动协调</title>
<link rel="stylesheet" href="../assets/d.css">
<style>
.stepbar{position:absolute;left:96px;right:96px;top:120px;display:flex;align-items:center;gap:16px}
.stepbar .ticks{display:flex;gap:8px;margin-left:24px}
.stepbar .ticks i{width:28px;height:10px;background:var(--g3);cursor:pointer;transition:all .3s}
.stepbar .ticks i.on{width:56px;background:var(--red)}
.stepbar .ticks i.done{background:var(--ink)}
.nd{position:absolute;border:3px solid var(--ink);background:var(--paper);padding:16px 22px;transition:all .5s}
.nd .k{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g2)}
.nd .t{font-size:26px;font-weight:900;margin-top:4px}
.nd .s{font-size:17px;font-weight:600;color:var(--g1);margin-top:6px;line-height:1.4}
.nd.focus{background:var(--ink);color:#fff}.nd.focus .s,.nd.focus .k{color:#c9c6bf}
.nd.warn{border-color:var(--red);box-shadow:0 0 0 6px rgba(228,50,27,.18)}
.nd.dim{opacity:.28}
#ed{position:absolute;inset:0;pointer-events:none}
.e{fill:none;stroke:var(--g3);stroke-width:3;transition:stroke .4s,stroke-width .4s,opacity .5s}
.e.on{stroke:var(--ink)}.e.hot{stroke:var(--red);stroke-width:6}.e.off{opacity:0}
.cap{position:absolute;left:96px;right:96px;bottom:40px;border-top:6px solid var(--ink);padding-top:22px;display:grid;grid-template-columns:200px 1fr 280px;gap:24px}
.cap .no{font-size:120px;font-weight:900;line-height:.85;color:var(--red);letter-spacing:-.04em}
.cap h2{font-size:34px;font-weight:900;line-height:1.25}
.cap p{font-size:22px;font-weight:500;line-height:1.55;margin-top:10px;color:#2a2926}
.cap .sr{font-size:18px;font-weight:800;color:var(--red);margin-top:8px}
.layer{position:absolute;left:96px;top:200px;display:flex;gap:12px}
.layer span{height:42px;padding:0 18px;display:flex;align-items:center;border:3px solid var(--ink);font-size:18px;font-weight:800;opacity:.35;transition:all .4s}
.layer span.on{opacity:1;background:var(--ink);color:#fff}
.layer span.fail{opacity:1;border-color:var(--red);color:var(--red);background:#fff}
.bub{position:absolute;padding:14px 18px;background:#fff;border:3px solid var(--ink);border-left:10px solid var(--red);font-size:19px;font-weight:800;line-height:1.4;opacity:0;transform:translateY(10px);transition:all .4s;max-width:360px}
.bub.show{opacity:1;transform:none}
.bub small{display:block;font-size:15px;font-weight:600;color:var(--g1);margin-top:4px}
</style></head>
<body><div class="stage">
 <div class="rule"></div>
 <div class="stepbar">
  <a class="back" data-def="17" href="../index.html#/17"><span>回到第 17 页</span></a>
  <h1 style="font-size:28px;font-weight:900">共享事件 ≠ 协作完成：冲突是怎么上浮到 Router 的</h1>
  <div class="ticks" id="ticks"></div>
  <div style="margin-left:auto;display:flex;gap:10px">
   <button class="btn" id="bp">←</button><button class="btn" id="bn">→</button><button class="btn" id="ba">自动</button>
  </div>
 </div>
 <div class="layer" id="layers">
  <span>第 1 层 · 信息可见（收到通知）</span><span>第 2 层 · 状态一致（按同版理解）</span><span>第 3 层 · 行动协调（修改不打架）</span>
 </div>
 <svg id="ed" viewBox="0 0 1920 1080"><defs>
  <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker>
 </defs><g id="edges"></g></svg>
 <div id="nodes"></div><div id="bubs"></div>
 <div class="cap">
  <div class="no" id="cn">01</div>
  <div id="ctxt"></div>
  <div class="hint" style="font-size:16px;font-weight:600;color:var(--g2);text-align:right;padding-top:20px">← → 翻步 · A 自动 · Esc 返回</div>
 </div>
</div>
<script src="../assets/detail.js"></script>
<script>
(()=>{
const SHOT=document.documentElement.classList.contains('shot');
const N={
 thread:{x:760,y:300,w:400,h:120,k:'Pub / Sub 广播',t:'Thread · 同一 PR #42',s:'多对多订阅 · 后续事件代码直送'},
 wA:{x:200,y:500,w:320,h:130,k:'Worker A',t:'改底层接口签名',s:'负责重构模块参数'},
 wB:{x:800,y:540,w:320,h:130,k:'Worker B',t:'写上层调用方',s:'并行开发新功能'},
 wC:{x:1400,y:500,w:320,h:130,k:'Worker C',t:'补集成测试',s:'订阅了同一个 PR Thread'},
 router:{x:760,y:710,w:400,h:110,k:'前台协调层',t:'Router（冲突汇聚点）',s:'Worker 解不开的冲突往上报'}
};
const E={
 't-a':['M760 380 H360 V500','both'],
 't-b':['M960 420 V540','both'],
 't-c':['M1160 380 H1560 V500','both'],
 'a-r':['M360 630 V765 H760','both'],
 'b-r':['M960 670 V765','both'],
 'c-r':['M1560 630 V765 H1160','both']
};
const S=[
 {h:'第 1 步 · 多对多订阅：三个 Worker 都收到了同一条事件',p:'原文的设计：让关联的 Worker 都订阅同一个 Thread，后续事件由代码直接广播给所有订阅者，不需要点对点发消息。',sr:'这一步解决了第 1 层「信息可见」——大家都看到了通知。',L:[0],act:['thread','wA','wB','wC'],focus:['thread'],edges:['t-a','t-b','t-c'],
  bub:[[200,380,'我将把 foo(a,b) 改成 foo(opts)','Worker A 在 Thread 留痕'],[1400,380,'已收到事件通知','Worker C']]},
 {h:'第 2 步 · 但“收到事件”不等于“按同一版本展开工作”',p:'Worker B 在收到通知前已经按旧签名写了一大半，或者把新通知压在了长上下文后面没及时调整——两边都订阅了 Thread，却在按不同前提写代码。',sr:'第 2 层「状态一致」开始出现裂痕：收到 ≠ 理解一致。',L:[0,1],act:['thread','wA','wB','wC'],focus:['wA','wB'],warn:['wA','wB'],edges:['t-a','t-b','t-c'],
  bub:[[200,380,'已提交新签名 foo(opts)','Worker A'],[800,420,'我刚按旧签名 foo(a,b) 写完调用','Worker B · 前提错位']]},
 {h:'第 3 步 · 冲突在共享环境里爆发：谁先改、谁返工？',p:'代码合并冲突、CI 变红、集成测试挂掉。因为 Worker 之间没有直接协商通道，光靠各自看事件流并不能自动排好谁退一步、谁重做。',sr:'第 3 层「行动协调」单靠 Pub/Sub 广播无法自动完成。',L:[0,1,2],act:['thread','wA','wB','wC'],focus:['wA','wB'],warn:['wA','wB','wC'],edges:['t-a','t-b','t-c'],
  bub:[[760,220,'Merge Conflict / 集成测试报错','共享环境冲突'],[1400,380,'我到底按哪一版接口写断言？','Worker C 卡住']]},
 {h:'第 4 步 · 解不开的跨任务冲突，最终上浮汇聚到 Router',p:'原文也提到「少数需要跨任务协调的情况由 Router 转达」。当冲突汇聚上来，Router 必须读懂两边的代码依赖才能拍板或问人。',sr:'如果此时 Router 只是看简短摘要的轻量模型，就会从「吞吐节点」变成「决策质量瓶颈」。',L:[0,1,2],act:['thread','wA','wB','wC','router'],focus:['router'],warn:['router'],edges:['t-a','t-b','t-c','a-r','b-r','c-r'],
  bub:[[760,625,'按谁的方案改？要不要打扰用户拍板？','Router 的判断空间骤增']]},
 {h:'第 5 步 · 工程启示：松耦合广播之外，还要补上版本与仲裁机制',p:'这不是说 Thread 订阅没用，而是认清它的边界：独立任务靠订阅就够；耦合任务需要补上处理水位（版本声明）、文件所有权划分或强模型仲裁。',sr:'核心结论：不要把「消灭点对点通信」等同于「消灭了协调成本」。',L:[0,1,2],act:['thread','wA','wB','wC','router'],focus:['thread','router'],edges:['t-a','t-b','t-c','a-r','b-r','c-r'],
  bub:[[200,230,'信息可见 ≠ 状态一致 ≠ 行动协调','三层拆解']]}
];
const NS='http://www.w3.org/2000/svg',EG=document.getElementById('edges'),ND=document.getElementById('nodes');
for(const id in E){const [d]=E[id];const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','e');p.setAttribute('marker-end','url(#ah)');EG.appendChild(p);E[id]={p}}
for(const id in N){const n=N[id],el=document.createElement('div');el.className='nd';el.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
 el.innerHTML=`<div class="k">${n.k}</div><div class="t">${n.t}</div><div class="s">${n.s}</div>`;ND.appendChild(el);n.el=el}
const ticks=document.getElementById('ticks'),layers=[...document.getElementById('layers').children];
S.forEach((_,i)=>{const t=document.createElement('i');t.onclick=()=>go(i);ticks.appendChild(t)});
let cur=-1,auto=null;
function go(i){i=Math.max(0,Math.min(S.length-1,i));cur=i;const s=S[i];
 for(const id in N){const el=N[id].el;el.classList.toggle('dim',!s.act.includes(id));el.classList.toggle('focus',s.focus.includes(id));el.classList.toggle('warn',(s.warn||[]).includes(id))}
 for(const id in E){const on=s.edges.includes(id);E[id].p.classList.toggle('on',on);E[id].p.classList.toggle('hot',on&&i>=3&&id.includes('-r'));E[id].p.classList.toggle('off',!on)}
 layers.forEach((L,j)=>{L.className='';if(s.L.includes(j))L.classList.add('on');if(j>=1&&i>=2&&i<4)L.classList.add('fail')});
 const B=document.getElementById('bubs');B.innerHTML='';
 (s.bub||[]).forEach(([x,y,t,sm])=>{const b=document.createElement('div');b.className='bub'+(SHOT?' show':'');b.style.left=x+'px';b.style.top=y+'px';b.innerHTML=t+(sm?'<small>'+sm+'</small>':'');B.appendChild(b);if(!SHOT)setTimeout(()=>b.classList.add('show'),180)});
 document.getElementById('ctxt').innerHTML=`<h2>${s.h}</h2><p>${s.p}</p><div class="sr">${s.sr}</div>`;
 document.getElementById('cn').textContent=String(i+1).padStart(2,'0');
 [...ticks.children].forEach((t,j)=>{t.classList.toggle('on',j===i);t.classList.toggle('done',j<i)});
 history.replaceState(null,'',location.pathname+location.search+'#step='+(i+1))}
function next(){go(cur>=S.length-1&&auto?0:cur+1)}
function toggleAuto(){const b=document.getElementById('ba');if(auto){clearInterval(auto);auto=null;b.classList.remove('on');b.textContent='自动'}else{auto=setInterval(next,5500);b.classList.add('on');b.textContent='暂停'}}
addEventListener('keydown',e=>{const k=e.key;if(['ArrowRight',' ','PageDown','Enter'].includes(k)){e.preventDefault();next()}else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();go(cur-1)}else if(k==='a'||k==='A')toggleAuto()});
document.getElementById('bn').onclick=e=>{e.stopPropagation();next()};document.getElementById('bp').onclick=e=>{e.stopPropagation();go(cur-1)};document.getElementById('ba').onclick=e=>{e.stopPropagation();toggleAuto()};
document.querySelector('.stage').addEventListener('click',e=>{if(e.target.closest('a,button,.ticks'))return;next()});
const m=(location.hash+location.search).match(/step=(\d+)/);go(m?parseInt(m[1],10)-1:0);
})();
</script></body></html>
